connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://rustfs:9000/iceberg
iceberg.rest-catalog.warehouse=iceberg-rest
iceberg.rest-catalog.security=SIGV4
# Required: Trino defaults to 'execute-api', which RustFS rejects (accepts s3 / sts / s3tables)
iceberg.rest-catalog.signing-name=s3
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

fs.native-s3.enabled=true
s3.region=us-east-1
s3.endpoint=http://rustfs:9000/
s3.aws-access-key=admin
s3.aws-secret-key=password
s3.path-style-access=true
